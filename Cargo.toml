[package]
name = "arboretum-td"
version = "0.1.0"
authors = ["Johannes Meintrup <johannes.meintrup@mni.thm.de>"]
edition = "2018"
license = "MIT"
description = "A library and CLI for obtaining exact and heuristc tree decompositions for arbitrary graphs"
homepage = "https://github.com/jmeintrup/arboretum"
repository = "https://github.com/jmeintrup/arboretum"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
num = "0.4.0"
rand = "0.8.3"
fxhash = "0.2.1"
bitvec = "0.19.1"
log = { version = "0.4.14", optional = true }
structopt = { version = "0.3.21", optional = true }
jemallocator = { version = "0.3.2", optional = true }
env_logger = { version = "0.8.3", optional = true }
ctrlc = { version = "3.1.9", optional = true, features = ["termination"] }
rmp-serde = "1.3.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
csv = "1.3.1"
lazy_static = "1.5.0"

[features]
handle-ctrlc = ["ctrlc"]
pace-logging = ["log", "env_logger"]
cli = ["structopt"]

[[bin]]
name = "arboretum-cli"
path = "src/main.rs"
required-features = ["cli"]
test = false

[[bin]]
name = "ml_selector"
path = "src/ml_selector.rs"
test = false

[[bin]]
name = "elimination_order"
path = "src/elimination_order.rs"
test = false
